server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      soundcloud: true
      http: true
      local: false
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  lavasrc:
    # yt-dlp handles searches and YouTube links directly, avoiding the
    # restricted InnerTube clients used by the older source plugin.
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      tidal: false
      ytdlp: true
    ytdlp:
      path: "/usr/local/bin/yt-dlp"
      searchLimit: 10
      playlistLoadLimit: 100

metrics:
  prometheus:
    enabled: false
